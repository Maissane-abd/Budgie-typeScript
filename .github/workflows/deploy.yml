
name: CI/CD Budgie

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: budgie-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Check Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build backend
        run: npm run build

  frontend:
    name: Check Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: 
      - backend
      - frontend

    if : github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: production
      url: https://monbudgie.fr

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST_KEY: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Docker Compose
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "debian@$VPS_HOST" \
            bash -se -- "$DEPLOY_SHA" <<'REMOTE'
          set -euo pipefail

          cd /home/debian/Budgie-typeScript

          # Refuser les modifications locales suivies par Git
          git diff --quiet
          git diff --cached --quiet

          # Récupérer les nouveaux commits
          git fetch origin main

          # Déployer le commit ayant déclenché le workflow
          git merge --ff-only "$1"

          # Vérifier que le commit est bien sélectionné
          test "$(git rev-parse HEAD)" = "$1"

          # Valider Docker Compose
          docker compose \
            -f compose.yml \
            -f compose.production.yml \
            config --quiet

          # Construire et démarrer les conteneurs
          docker compose \
            -f compose.yml \
            -f compose.production.yml \
            up -d --build --wait

          # Afficher les conteneurs
          docker compose \
            -f compose.yml \
            -f compose.production.yml \
            ps
          REMOTE

      - name: Check website
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            --output /dev/null \
            https://monbudgie.fr/
