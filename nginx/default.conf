
# HTTP : validation Let's Encrypt et redirection HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name monbudgie.fr www.monbudgie.fr;

    # Ne pas rediriger les requêtes de validation Certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://monbudgie.fr$request_uri;
    }
}

# HTTPS : redirection www vers le domaine principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.monbudgie.fr;

    ssl_certificate /etc/letsencrypt/live/monbudgie.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monbudgie.fr/privkey.pem;

    return 301 https://monbudgie.fr$request_uri;
}

# HTTPS : application Budgie
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name monbudgie.fr;

    ssl_certificate /etc/letsencrypt/live/monbudgie.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monbudgie.fr/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Frontend Vue.js
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend Express.js
    location /api {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
